name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
        # Use Python to safely determine its own version and trigger pip
        python -c "
        import sys, subprocess
        py_ver = f'{sys.version_info.major}.{sys.version_info.minor}'
        url = f'https://raw.githubusercontent.com{py_ver}.txt'
        subprocess.run(['pip', 'install', 'apache-airflow==2.10.0', '--constraint', url], check=True)
        "
        
        # Install compatible linter dependencies 
        pip install "pylint<3.0.0" pylint-airflow
        
    - name: Analysing the code with pylint
      run: |
        pylint --load-plugins=pylint_airflow --disable=pointless-statement $(git ls-files '*.py')
