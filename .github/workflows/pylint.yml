name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
          # 1. Fetch exact dependency constraints to prevent dependency hell
        AIRFLOW_VERSION=2.10.5
        CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${{ matrix.python-version }}.txt"
        
        # 2. Install Airflow, Pylint, and the dedicated Airflow plugin together
        pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"
        pip install pylint pylint-airflow
        
    - name: Analysing the code with pylint
      run: |
        # --load-plugins flags Airflow objects correctly
        # --disable=pointless-statement permits tasks chained together with '>>'
        pylint --load-plugins=pylint_airflow --disable=pointless-statement $(git ls-files '*.py')
