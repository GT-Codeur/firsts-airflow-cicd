name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Note: Pinning Pylint 2.x means testing up to Python 3.10 is safest.
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
        # 1. Fetch exact dependency constraints for Airflow stability
        AIRFLOW_VERSION=2.10.5
        CONSTRAINT_URL="https://githubusercontent.com{AIRFLOW_VERSION}/constraints-${{ matrix.python-version }}.txt"
        
        # 2. Install Airflow using official constraints
        pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"
        
        # 3. CRITICAL FIX: Pin pylint to < 3.0.0 to prevent the IAstroidChecker crash
        pip install "pylint<3.0.0" pylint-airflow
        
    - name: Analysing the code with pylint
      run: |
        pylint --load-plugins=pylint_airflow --disable=pointless-statement $(git ls-files '*.py')
