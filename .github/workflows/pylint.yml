name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
        # 1. Store variables using standard bash format
        AIRFLOW_VERSION="2.10.0"
        PYTHON_VERSION="${{ matrix.python-version }}"
        
        # 2. Use simple dollar-signs without brackets so GitHub does not break the URL
        CONSTRAINT_URL="https://githubusercontent.com"
        
        # 3. Execute installation safely
        pip install "apache-airflow==$AIRFLOW_VERSION" --constraint "$CONSTRAINT_URL"
        pip install "pylint<3.0.0" pylint-airflow
        
    - name: Analysing the code with pylint
      run: |
        pylint --load-plugins=pylint_airflow --disable=pointless-statement $(git ls-files '*.py')
